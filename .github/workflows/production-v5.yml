name: railway-production-v5
on:
  push:
    branches: [main, railway-production-v5]
  pull_request:
    branches: [main]
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Topology regression
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Python syntax
        run: python -m py_compile scripts/gateway.py scripts/generate.py
